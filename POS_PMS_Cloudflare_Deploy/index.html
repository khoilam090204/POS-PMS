async function submitProgress(e){e.preventDefault();let p=packBy(document.getElementById('reportPack').value),qty=Number(document.getElementById('reportQty').value),date=document.getElementById('reportDate').value,note=document.getElementById('reportNote').value.trim(),file=document.getElementById('reportFile').files[0];if(!p||p.dept!==role().dept||!['sup-pip','sup-eit','proc'].includes(activeRole)){toast('Không có quyền gửi báo cáo cho bộ phận này.');return}let pending=DB.approvals.filter(x=>x.packId===p.id&&x.status.startsWith('PENDING')).reduce((s,x)=>s+x.qty,0);if(!Number.isFinite(qty)||qty<=0||qty>p.total-p.approved-pending+0.000001){toast('Khối lượng phải > 0 và không vượt scope còn lại.');return}if(note.length<12){toast('Mô tả công việc tối thiểu 12 ký tự.');return}if(p.requiresEvidence&&!file){toast('Workpack này bắt buộc có minh chứng.');return}if(file&&file.size>750000){toast('Tệp demo vượt 750 KB. Hãy chọn một file nhỏ hơn.');return}let evidence=null;if(file){let data=await new Promise((resolve,reject)=>{let reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});evidence={name:file.name,type:file.type,size:file.size,data}}let rec={id:'PR-'+String(Date.now()).slice(-8),packId:p.id,qty,date,note,evidence,submittedBy:activeRole,status:'PENDING_LEAD',created:new Date().toISOString()};DB.approvals.unshift(rec);audit('SUBMITTED',`Báo cáo +${fmt(qty)} ${p.unit} cho ${p.id}; chờ trưởng bộ phận phê duyệt`,rec.id);save();toast('Đã gửi báo cáo '+rec.id+' đến trưởng bộ phận.');render()}

function downloadEvidence(id){let r=DB.approvals.find(x=>x.id===id);if(!r?.evidence?.data)return;let a=document.createElement('a');a.href=r.evidence.data;a.download=r.evidence.name;a.click()}
function decide(id,approved){let r=DB.approvals.find(x=>x.id===id);if(!r)return;let p=packBy(r.packId);let leadOK=r.status==='PENDING_LEAD'&&activeRole.startsWith('lead-')&&role().dept===p.dept&&activeRole!==r.submittedBy;let qaOK=r.status==='PENDING_QA'&&activeRole==='qa'&&activeRole!==r.submittedBy;if(!leadOK&&!qaOK){toast('Bạn không có thẩm quyền phê duyệt bản ghi này.');return}let reason=document.getElementById('approvalNote')?.value?.trim()||'';if(!approved&&reason.length<8){toast('Cần nêu lý do từ chối ít nhất 8 ký tự.');return}if(approved&&p.requiresEvidence&&!r.evidence){toast('Không thể phê duyệt khi thiếu minh chứng bắt buộc.');return}if(approved){if(leadOK&&p.requiresQA){r.status='PENDING_QA';r.leadBy=activeRole;r.leadAt=new Date().toISOString();r.leadNote=reason;audit('LEAD_APPROVED',`${id} được trưởng bộ phận duyệt và chuyển QA/QC`,id)}else{if(p.approved+r.qty>p.total+.00001){toast('Không thể duyệt do vượt scope công việc.');return}r.status='APPROVED';r.approvedBy=activeRole;r.approvedAt=new Date().toISOString();r.approvalNote=reason;p.approved=Math.round((p.approved+r.qty)*1000)/1000;audit('OFFICIAL_PUBLISHED',`${id} công bố +${fmt(r.qty)} ${p.unit}, mới nhất ${fmt(p.approved)}/${fmt(p.total)}`,id)}}else{r.status='REJECTED';r.rejectedBy=activeRole;r.rejectedAt=new Date().toISOString();r.rejectReason=reason;audit('REJECTED',`${id} từ chối: ${reason}`,id)}save();closeModal();render();toast(approved?(leadOK&&p.requiresQA?'Đã duyệt cấp bộ phận, chuyển QA/QC.':'Đã phê duyệt và cập nhật Official Progress.'):'Đã từ chối, giữ nguyên Official Progress.')}
function schedule(){let d=weighted('approved')-weighted('planned');return head('PLANNING / SCHEDULE CONTROL','Planning & S-Curve','Giao diện mẫu để tích hợp dữ liệu Primavera P6 và theo dõi variance theo workpack.')+demoBar()+stats()+`<div class="grid-main"><div class="card"><div class="card-head"><div><div class="card-title">Project S-Curve · Weekly</div><div class="card-desc">Approved quantity based weighted progress · dữ liệu demo</div></div></div><div class="card-body">${chart()}</div></div><div class="card"><div class="card-head"><div class="card-title">Schedule Health</div></div><div class="card-body"><div class="detail-stack"><div><span>Planned %</span><strong>${weighted('planned').toFixed(1)}%</strong></div><div><span>Actual Approved %</span><strong>${weighted('approved').toFixed(1)}%</strong></div><div><span>Progress Variance</span><strong class="${d<0?'text-red':'text-green'}">${d.toFixed(1)} pp</strong></div><div><span>Data Source</span><strong>DEMO Workpack Data</strong></div></div><p class="helpbox" style="margin-top:15px">Để tính Forecast Finish / Critical Path chuẩn xác cần import đầy đủ activity logic, calendar, data date, constraints từ P6. Bản prototype chưa tính CPM.</p></div></div></div>`}
function resources(){let items=[['Manpower & POB','Supervisor allocation, manpower loading, rotation','users'],['Equipment & Tools','Availability, certification, utilisation, breakdown','wrench'],['Procurement & Materials','PO, site receipt, material readiness, shortages','truck'],['Marine & Logistics','Vessel movement, weather window, loadout, standby','briefcase']];return head('PROJECT RESOURCES','Nguồn lực & vật tư','Thiết kế các phân hệ nguồn lực sẽ kết nối theo Workpack và Forecast.')+demoBar()+`<div class="columns3">${items.map((a,i)=>`<div class="deptbox"><span class="stat-ico">${ic(a[2])}</span><h4 style="margin-top:16px">${a[0]}</h4><p>${a[1]}</p><span class="tag ${i===2?'blue':'gray'}">${i===2?'Demo dataset':'Upcoming module'}</span></div>`).join('')}</div><div class="card" style="margin-top:18px"><div class="card-head"><div class="card-title">Material Readiness – Mock Data</div></div><div class="card-body"><p>Procurement Workpack: <b>WP-PRC-001</b> · Approved: <b>${fmt(packBy('WP-PRC-001').approved)}/${fmt(packBy('WP-PRC-001').total)}</b> PO lines.</p><button class="btn sky" onclick="openPack('WP-PRC-001')">Xem Workpack →</button></div></div>`}
function quality(){return head('HSE / QAQC / COMPLETION','HSE · Quality · System Completion','Trạng thái an toàn và nghiệm thu được quản lý bằng các cổng kiểm soát chuyên môn.')+demoBar()+`<div class="columns3">${[['HSE & SIMOPS','PTW, JSA, LOTO, risk controls, incidents, corrective actions','shield'],['QA/QC Inspection','ITP, inspection request, NDT, test records, NCR, QC release','checklist'],['Mechanical Completion','MC certificates, punch lists, system handover, dossier','file']].map(a=>`<div class="deptbox"><span class="stat-ico">${ic(a[2])}</span><h4 style="margin-top:15px">${a[0]}</h4><p>${a[1]}</p><span class="tag gray">Upcoming module</span></div>`).join('')}</div><div class="card" style="margin-top:16px"><div class="card-head"><div class="card-title">Quality Release vs Progress Approval</div></div><div class="card-body"><div class="helpbox">Trưởng bộ phận duyệt báo cáo thực hiện không thay thế QA/QC inspection hoặc Client acceptance. Những Workpack có requiresQA được chuyển tiếp sang QA/QC trước khi công bố progress chính thức trong demo.</div></div></div>`}
function reports(){return head('PROJECT REPORTING','Báo cáo dự án','Tổng hợp số liệu chính thức và tình trạng phê duyệt theo từng kỳ báo cáo.',`<button class="btn primary" onclick="exportCSV()">${ic('download')} Xuất CSV tiến độ</button>`)+demoBar()+stats()+`<div class="card"><div class="card-head"><div class="card-title">Daily Progress Summary</div></div><div class="card-body"><p class="muted">Báo cáo được tính từ Approved Progress Records, không cộng bản ghi pending hoặc rejected.</p><div class="helpbox">Trong phiên bản chính thức, bộ phận Planning sẽ xác nhận Data Date, khóa snapshot, đối chiếu P6/DPR và phát hành Daily/Weekly/Monthly Report có revision và người ký.</div></div></div>`}
function audits(){let rows=DB.audit.filter(r=>role().dept==='ALL'||r.record==='System'||r.record.startsWith('PR-')&&(()=>{let req=DB.approvals.find(x=>x.id===r.record);return req&&(role().dept==='QA/QC'||packBy(req.packId)?.dept===role().dept)})());return head('COMPLIANCE / AUDIT','Audit Trail & Change History','Nhật ký theo thời gian: ai báo cáo, ai duyệt, thay đổi gì và khi nào.',`<button class="btn" onclick="exportAudit()">${ic('download')} Export Audit CSV</button>`)+demoBar()+`<div class="card"><div class="card-head"><div><div class="card-title">System Audit Events</div><div class="card-desc">Lưu trong trình duyệt cho mục đích mô phỏng, không phải nhật ký chống sửa đổi.</div></div></div><div class="card-body" style="padding-top:14px">${rows.map(x=>`<div class="auditline"><div style="display:flex;justify-content:space-between;gap:10px"><strong>${escapeHtml(x.action)} · ${escapeHtml(x.record)}</strong><span class="time">${timeStr(x.at)}</span></div><p><b>${escapeHtml(x.by)}</b> — ${escapeHtml(x.detail)}</p></div>`).join('')}</div></div>`}
function settings(){return head('SYSTEM CONFIGURATION','Phân quyền & cấu hình','Nguyên mẫu quy tắc Role + Department + Record Ownership; chưa phải security enforcement.')+demoBar()+`<div class="card"><div class="card-head"><div><div class="card-title">Role & Permission Matrix</div><div class="card-desc">Mô phỏng vai trò để kiểm tra hành vi giao diện</div></div></div><div class="tablewrap"><table class="datatable"><thead><tr><th>Role</th><th>Department</th><th>Scope</th><th>Submit Progress</th><th>Approve</th></tr></thead><tbody>${roles.map(r=>`<tr><td class="td-bold">${escapeHtml(r.name)}</td><td>${escapeHtml(r.dept)}</td><td>${r.dept==='ALL'?'All projects (demo)':r.dept+' only'}</td><td>${r.id.startsWith('sup-')||r.id==='proc'?'Yes':'No'}</td><td>${r.id.startsWith('lead-')?'Department':r.id==='qa'?'QA/QC':'No'}</td></tr>`).join('')}</tbody></table></div></div><div class="card" style="margin-top:17px"><div class="card-head"><div class="card-title">Môi trường thử nghiệm</div></div><div class="card-body"><div class="helpbox">Trong web thực tế cần SSO/MFA, backend RBAC, database dùng chung, object storage, audit bất biến/append-only, backup và change control. Thay đổi vai trò tại đây chỉ là simulation.</div><button class="btn danger" style="margin-top:16px" onclick="resetDemo()">${ic('refresh')} Khôi phục dữ liệu demo ban đầu</button></div></div>`}
function resetDemo(){if(!confirm('Xóa tất cả thay đổi dữ liệu demo đang lưu trên trình duyệt này?'))return;DB=fresh();save();render();toast('Đã khôi phục dữ liệu mẫu.')}
function csvDownload(filename,rows){let csv='\ufeff'+rows.map(x=>x.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');let b=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(){csvDownload('POS_PMS_Demo_Progress.csv',[['Workpack','JobCard','Title','Department','Location','Total','Planned','Approved','Unit','Planned %','Approved %'],...visiblePacks().map(p=>[p.id,p.job,p.title,p.dept,p.location,p.total,p.planned,p.approved,p.unit,pct(p.planned,p.total).toFixed(2),pct(p.approved,p.total).toFixed(2)])]);toast('Đã xuất CSV dữ liệu demo.')}
function exportAudit(){csvDownload('POS_PMS_Demo_Audit.csv',[['Time','Action','Actor','Record','Description'],...DB.audit.map(a=>[a.at,a.action,a.by,a.record,a.detail])]);toast('Đã xuất Audit CSV demo.')}
function modal(title,body,foot){document.getElementById('modalHost').innerHTML=`<div class="modal-cover" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true"><div class="modal-head">${title}<button class="xclose" title="Đóng" onclick="closeModal()">×</button></div><div class="modal-content">${body}</div><div class="modal-foot">${foot}</div></div></div>`}function closeModal(){document.getElementById('modalHost').innerHTML=''}
function render(){renderNav();let views={dashboard,projects,workpacks,report,approvals,schedule,resources,quality,reports,audit:audits,settings};document.getElementById('view').innerHTML=(views[page]||dashboard)();if(page==='report')updateReportHelp()}
document.getElementById('rolePicker').addEventListener('change',e=>setRole(e.target.value));document.getElementById('globalSearch').addEventListener('keydown',e=>{if(e.key==='Enter'){searchQuery=e.target.value;goto('workpacks')}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
</script>
</body></html>
